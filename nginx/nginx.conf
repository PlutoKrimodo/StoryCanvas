# ============================================================
# 生产/集成环境入口 Nginx（docker-compose 的 nginx 服务挂载）
#
#   /api  -> C++ 后端（8080）
#   /     -> 前端容器（80）
#
# HTTPS 段默认注释：把证书放入 nginx/ssl/ 后取消注释即可启用
# ============================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # 普通请求体积上限（见 docs/16 第 7.4 节；文件上传能力已随在线编辑子系统移除）
    client_max_body_size 1m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;

    # 后端：内部鉴权与密钥由容器环境变量注入，此处仅做转发
    upstream storycanvas_backend {
        server backend:8080;
    }

    upstream storycanvas_frontend {
        server frontend:80;
    }

    server {
        listen       80;
        server_name  _;

        # 安全响应头
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;

        location /api/ {
            proxy_pass http://storycanvas_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        location /health {
            proxy_pass http://storycanvas_backend/health;
        }

        location / {
            proxy_pass http://storycanvas_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ==================== HTTPS（可选）====================
    # server {
    #     listen       443 ssl http2;
    #     server_name  storycanvas.local;
    #
    #     ssl_certificate     /etc/nginx/ssl/cert.pem;
    #     ssl_certificate_key /etc/nginx/ssl/key.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #
    #     location /api/ { proxy_pass http://storycanvas_backend; }
    #     location /     { proxy_pass http://storycanvas_frontend; }
    # }
}
