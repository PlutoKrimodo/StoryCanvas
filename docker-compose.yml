version: '3.8'

# 安全约定：
#   - 所有密钥类变量必须显式注入，缺失即启动失败（`${VAR:?}` 语法），
#     避免出现 "secret"/"password" 这类弱默认值
#   - 本地开发：cp .env.example .env 后填写真实值即可

services:
  # ==================== 数据库 ====================
  postgres:
    image: postgres:15-alpine
    container_name: storycanvas-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-storycanvas}
      POSTGRES_USER: ${DB_USER:-storycanvas}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 必须配置（见 .env.example）}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-storycanvas}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - storycanvas-network

  redis:
    image: redis:7-alpine
    container_name: storycanvas-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - storycanvas-network

  # ==================== C++ 后端 ====================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: storycanvas-backend
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-storycanvas}
      - DB_USER=${DB_USER:-storycanvas}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD 必须配置}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET 必须配置（见 .env.example）}
      - AI_SERVICE_URL=http://ai-service:8000
      - AI_SERVICE_API_KEY=${AI_SERVICE_API_KEY:?AI_SERVICE_API_KEY 必须配置}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - STORAGE_PATH=/app/storage
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - storycanvas-network

  # ==================== Python AI Service ====================
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: storycanvas-ai-service
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_API_BASE=${OPENAI_API_BASE:-https://api.openai.com/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-3.5-turbo}
      - STABILITY_API_KEY=${STABILITY_API_KEY:-}
      - STABILITY_API_HOST=${STABILITY_API_HOST:-https://api.stability.ai}
      - INTERNAL_API_KEY=${AI_SERVICE_API_KEY:?AI_SERVICE_API_KEY 必须配置}
      - CORS_ORIGINS=["http://localhost:5173"]
      - STORAGE_PATH=/app/storage
      - DEBUG=${DEBUG:-false}
    volumes:
      - ./storage:/app/storage
    networks:
      - storycanvas-network

  # ==================== 前端 ====================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: storycanvas-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend
    networks:
      - storycanvas-network

  # ==================== Nginx 反向代理（可选）====================
  nginx:
    image: nginx:alpine
    container_name: storycanvas-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - storycanvas-network

volumes:
  postgres_data:
  redis_data:

networks:
  storycanvas-network:
    driver: bridge
